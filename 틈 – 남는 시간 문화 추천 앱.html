<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>틈 – 남는 시간 문화 추천</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDEFF5;--card:#fff;--ink:#1B2340;--sub:#5D6482;--line:#D9DCE8;--gap:#3A4BFF;--gapink:#fff;--sun:#FFD84D;--box:box-sizing:border-box;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1226;--card:#1A1E3A;--ink:#EEF0FF;--sub:#9AA0C4;--line:#2B3058;--gap:#7C89FF;--gapink:#0F1226}}
:root[data-theme="dark"]{--bg:#0F1226;--card:#1A1E3A;--ink:#EEF0FF;--sub:#9AA0C4;--line:#2B3058;--gap:#7C89FF;--gapink:#0F1226}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 "Noto Sans KR",system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;position:relative}
main{flex:1;overflow-y:auto;padding:20px 18px 24px}
h1,h2{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;letter-spacing:-.01em}
h1{font-size:34px;line-height:1.15}
h2{font-size:20px;margin:22px 0 10px}
.lead{color:var(--sub);margin-top:6px}
.brand{display:flex;align-items:center;gap:6px;font-family:"Black Han Sans";font-size:22px}
.brand i{display:inline-block;width:22px;height:22px;background:linear-gradient(90deg,var(--ink) 0 38%,transparent 38% 62%,var(--ink) 62%);border-radius:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 15px;font:500 14px "Noto Sans KR";cursor:pointer}
.chip[aria-pressed=true]{background:var(--gap);border-color:var(--gap);color:var(--gapink)}
.time{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.time .chip{border-radius:12px;padding:14px 0;font-size:16px;font-weight:700;text-align:center}
.cta{width:100%;margin-top:26px;background:var(--ink);color:var(--bg);border:0;border-radius:14px;padding:16px;font:700 16px "Noto Sans KR";cursor:pointer}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.card h3{font-size:17px;font-weight:700;margin:4px 0}
.meta{color:var(--sub);font-size:13px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--sun);color:#1B2340;margin-right:4px}
.tag.alt{background:var(--line);color:var(--ink)}
.bar{height:12px;border-radius:6px;background:var(--line);margin:12px 0 4px;position:relative;overflow:hidden}
.bar b{position:absolute;left:0;top:0;bottom:0;background:var(--gap);border-radius:6px 0 0 6px}
.barlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:10px;font:500 14px "Noto Sans KR";cursor:pointer}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.pri{background:var(--gap);color:var(--gapink);border-color:var(--gap);font-weight:700}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--sub);padding:12px 0 10px;font:500 12px "Noto Sans KR";cursor:pointer}
nav button .ic{display:block;font-size:20px}
nav button[aria-current=true]{color:var(--gap);font-weight:700}
.empty{text-align:center;color:var(--sub);padding:36px 10px}
.stats{display:flex;gap:8px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font:400 24px "Black Han Sans"}
.back{border:0;background:none;color:var(--gap);font:700 14px "Noto Sans KR";cursor:pointer;padding:0 0 8px}
#sheet{position:absolute;inset:0;background:rgba(10,12,30,.55);display:none;align-items:flex-end}
#sheet.show{display:flex}
#sheet .in{background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
textarea{width:100%;margin-top:10px;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);font:400 15px "Noto Sans KR";resize:none}
.stars button{border:0;background:none;font-size:28px;color:var(--line);cursor:pointer}
.stars button.on{color:#F5B800}
button:focus-visible{outline:3px solid var(--gap);outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <main id="main"></main>
  <nav>
    <button data-t="find"><span class="ic">⌛</span>찾기</button>
    <button data-t="saved"><span class="ic">♡</span>저장</button>
    <button data-t="log"><span class="ic">▤</span>기록</button>
  </nav>
  <div id="sheet" role="dialog" aria-modal="true"><div class="in" id="sheetIn"></div></div>
</div>
<script>
const A=[
["골목 갤러리 기획전","전시",40,["혼자","친구","연인"],8,"작은 갤러리에서 신진 작가의 전시를 가볍게 둘러봐요."],
["사진 전시관","전시",60,["혼자","친구","연인","가족"],12,"사진 한 장 한 장을 천천히 보며 쉬어가요."],
["미디어아트 체험관","전시",90,["친구","연인","가족"],15,"빛과 소리로 가득한 몰입형 전시예요."],
["동네 미술관 상설전","전시",120,["혼자","연인","가족"],18,"여유롭게 걸으며 대표 소장품을 감상해요."],
["거리 버스킹 구경","공연",30,["혼자","친구","연인"],5,"광장에서 열리는 라이브 공연을 잠깐 즐겨요."],
["소극장 연극","공연",90,["친구","연인"],14,"가까이에서 배우의 숨결을 느끼는 90분."],
["낮 시간 클래식 콘서트","공연",80,["혼자","연인","가족"],16,"부담 없는 낮 공연으로 마음을 쉬게 해요."],
["주말 플리마켓","축제",60,["친구","연인","가족"],10,"수공예품과 먹거리를 구경하며 걸어요."],
["야외 문화 축제","축제",180,["친구","연인","가족"],20,"공연·체험·먹거리가 모인 한나절 축제."],
["캘리그라피 체험","체험",60,["혼자","친구","연인"],9,"내 이름을 붓글씨로 써서 가져가요."],
["전통 다도 체험","체험",45,["혼자","친구","연인"],11,"차 한 잔과 함께 호흡을 가다듬어요."],
["향수 만들기 클래스","체험",90,["친구","연인"],13,"나만의 향을 골라 조향해요."],
["도자기 원데이 클래스","체험",120,["친구","연인","가족"],15,"흙을 빚어 작은 그릇을 만들어요."],
["한옥 공방 반나절 체험","체험",240,["친구","연인","가족"],25,"목공, 염색 등 공방 체험을 깊이 즐겨요."],
["독립서점 책 고르기","취미",40,["혼자","친구","연인"],7,"책방 주인의 큐레이션 속에서 한 권을 골라요."],
["공원 스케치 산책","취미",30,["혼자","친구"],4,"작은 노트를 들고 풍경을 그려요."],
["LP 바 음악 감상","취미",60,["혼자","친구","연인"],10,"턴테이블 소리에 푹 빠져봐요."],
["보드게임 카페","취미",120,["친구","연인","가족"],9,"새로운 게임을 배우며 시간 가는 줄 몰라요."],
["문화유산 스탬프 투어","취미",150,["혼자","친구","가족"],17,"유적지를 걸으며 스탬프를 모아요."],
["어린이 과학관","체험",150,["가족"],22,"아이와 함께 만지고 실험하는 전시."]
].map((a,i)=>({id:i,t:a[0],c:a[1],m:a[2],w:a[3],d:a[4],s:a[5]}));
const CATS=["전시","공연","축제","체험","취미"],WHO=["혼자","친구","연인","가족"],TIMES=[[30,"30분"],[60,"1시간"],[120,"2시간"],[240,"반나절"]];
const S={tab:"find",t:60,who:"혼자",cats:[],res:null,sel:null,saved:[],log:[]};
try{const x=JSON.parse(localStorage.getItem("teum")||"null");if(x){S.saved=x.saved||[];S.log=x.log||[]}}catch(e){}
const save=()=>{try{localStorage.setItem("teum",JSON.stringify({saved:S.saved,log:S.log}))}catch(e){}};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=m=>m>=60?(m%60?Math.floor(m/60)+"시간 "+m%60+"분":m/60+"시간"):m+"분";
const catCount=c=>S.log.filter(l=>A[l.id].c===c).length;

function recommend(){
  return A.filter(a=>a.w.includes(S.who)&&(!S.cats.length||S.cats.includes(a.c))&&a.m+a.d*2<=S.t)
    .map(a=>({a,score:(a.m+a.d*2)/S.t+(catCount(a.c)?0.1:0)})).sort((x,y)=>y.score-x.score).map(x=>x.a);
}
function card(a,open){
  const tot=a.m+a.d*2,pct=Math.min(100,Math.round(tot/S.t*100)),done=S.log.filter(l=>l.id===a.id).length;
  const hist=S.log.length?(catCount(a.c)?'<span class="tag alt">자주 즐긴 분야</span>':'<span class="tag alt">새로운 분야</span>'):"";
  const sv=S.saved.includes(a.id);
  return `<div class="card"><span class="tag">${a.c}</span>${hist}${done?'<span class="tag alt">참여 '+done+'회</span>':""}
  <h3>${a.t}</h3><p>${a.s}</p>
  <div class="meta">활동 ${fmt(a.m)} · 도보 ${a.d}분 거리 · 이동 포함 약 ${fmt(tot)}</div>
  <div class="bar" title="남은 시간 대비 소요"><b style="width:${pct}%"></b></div>
  <div class="barlbl"><span>소요 ${fmt(tot)}</span><span>남은 시간 ${fmt(S.t)}</span></div>
  <div class="row"><button class="btn ${sv?"on":""}" data-save="${a.id}">${sv?"저장됨":"저장"}</button>
  <button class="btn pri" data-done="${a.id}">참여했어요</button></div></div>`;
}
function find(){
  if(S.res){
    return `<button class="back" data-back>‹ 조건 바꾸기</button>
    <h1>${fmt(S.t)}, ${S.who}</h1><p class="lead">${S.res.length?"지금 바로 갈 수 있는 활동 "+S.res.length+"개":""}</p>
    <div style="margin-top:16px">${S.res.length?S.res.map(a=>card(a)).join(""):'<div class="empty">조건에 맞는 활동이 없어요.<br>시간을 늘리거나 분야를 바꿔보세요.</div>'}</div>`;
  }
  return `<div class="brand"><i></i>틈</div>
  <h1 style="margin-top:22px">지금 비어 있는<br>시간이 얼마나 되나요?</h1>
  <p class="lead">남은 시간에 딱 맞는 문화·여가 활동을 골라드려요.</p>
  <h2>남은 시간</h2><div class="time">${TIMES.map(([m,l])=>`<button class="chip" aria-pressed="${S.t===m}" data-time="${m}">${l}</button>`).join("")}</div>
  <h2>누구와 함께해요?</h2><div class="chips">${WHO.map(w=>`<button class="chip" aria-pressed="${S.who===w}" data-who="${w}">${w}</button>`).join("")}</div>
  <h2>하고 싶은 활동 <span class="meta">(복수 선택, 비우면 전체)</span></h2>
  <div class="chips">${CATS.map(c=>`<button class="chip" aria-pressed="${S.cats.includes(c)}" data-cat="${c}">${c}</button>`).join("")}</div>
  <button class="cta" data-go>틈 채우기</button>`;
}
function saved(){
  const l=S.saved.map(id=>A[id]);
  return `<h1>저장한 활동</h1><p class="lead">가고 싶은 곳을 모아두세요.</p><div style="margin-top:16px">`+
  (l.length?l.map(a=>card(a)).join(""):'<div class="empty">아직 저장한 활동이 없어요.<br>찾기 탭에서 마음에 드는 활동을 저장해보세요.</div>')+"</div>";
}
function log(){
  const n=S.log.length,mins=S.log.reduce((s,l)=>s+A[l.id].m,0);
  return `<h1>나의 문화 기록</h1><p class="lead">남는 시간이 경험으로 바뀐 순간들이에요.</p>
  <div class="stats" style="margin-top:16px"><div class="stat"><b>${n}</b><span class="meta">참여한 활동</span></div>
  <div class="stat"><b>${fmt(mins)}</b><span class="meta">채운 시간</span></div>
  <div class="stat"><b>${new Set(S.log.map(l=>A[l.id].c)).size}/5</b><span class="meta">경험한 분야</span></div></div>
  <h2>기록</h2>`+(n?[...S.log].reverse().map(l=>{const a=A[l.id];return `<div class="card"><span class="tag">${a.c}</span><span class="meta">${l.date}</span>
  <h3>${a.t}</h3><div style="color:#F5B800">${"★".repeat(l.r)}<span style="color:var(--line)">${"★".repeat(5-l.r)}</span></div>${l.memo?`<p>${esc(l.memo)}</p>`:""}</div>`}).join(""):
  '<div class="empty">아직 기록이 없어요.<br>활동에 참여하고 “참여했어요”를 눌러보세요.</div>');
}
function render(){
  $("#main").innerHTML={find,saved,log}[S.tab]();
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.t===S.tab));
}
function openSheet(id){
  S.sel=id;S.rate=5;const a=A[id];
  $("#sheetIn").innerHTML=`<h2 style="margin-top:0">${a.t}</h2><p class="meta">어땠는지 기록해두세요.</p>
  <div class="stars" id="stars">${[1,2,3,4,5].map(i=>`<button data-r="${i}" class="on" aria-label="${i}점">★</button>`).join("")}</div>
  <textarea id="memo" rows="3" maxlength="120" placeholder="한 줄 메모 (선택)"></textarea>
  <div class="row"><button class="btn" data-close>취소</button><button class="btn pri" data-commit>기록하기</button></div>`;
  $("#sheet").classList.add("show");
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.t){S.tab=d.t;render();$("#main").scrollTop=0}
  else if(d.time){S.t=+d.time;render()}
  else if(d.who){S.who=d.who;render()}
  else if(d.cat){S.cats=S.cats.includes(d.cat)?S.cats.filter(c=>c!==d.cat):[...S.cats,d.cat];render()}
  else if(d.go!==undefined){S.res=recommend();render();$("#main").scrollTop=0}
  else if(d.back!==undefined){S.res=null;render()}
  else if(d.save){const id=+d.save;S.saved=S.saved.includes(id)?S.saved.filter(x=>x!==id):[...S.saved,id];save();const y=$("#main").scrollTop;render();$("#main").scrollTop=y}
  else if(d.done)openSheet(+d.done);
  else if(d.r){S.rate=+d.r;document.querySelectorAll("#stars button").forEach((s,i)=>s.classList.toggle("on",i<S.rate))}
  else if(d.close!==undefined)$("#sheet").classList.remove("show");
  else if(d.commit!==undefined){
    S.log.push({id:S.sel,date:new Date().toLocaleDateString("ko-KR"),r:S.rate,memo:$("#memo").value.trim()});
    save();$("#sheet").classList.remove("show");S.tab="log";render();
  }
});
render();
</script>
</body>
</html>
